name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [source-updated]
  schedule:
    - cron: '17 2 * * *'

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout website repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve source revisions
        run: |
          agents_sha=$(git ls-remote https://github.com/lennonli/licheng-AGENTS.md.git refs/heads/main | cut -f1)
          skills_sha=$(git ls-remote https://github.com/lennonli/licheng-skills.git refs/heads/main | cut -f1)
          tutorials_sha=$(git ls-remote https://github.com/lennonli/licheng-AI-tutorials.git refs/heads/main | cut -f1)
          kbmono_sha=$(git ls-remote https://github.com/lennonli/ipo-inquiry-kb.git refs/heads/main | cut -f1)
          test -n "$agents_sha"
          test -n "$skills_sha"
          test -n "$tutorials_sha"
          test -n "$kbmono_sha"
          echo "SOURCE_AGENTS_SHA=$agents_sha" >> "$GITHUB_ENV"
          echo "SOURCE_SKILLS_SHA=$skills_sha" >> "$GITHUB_ENV"
          echo "SOURCE_TUTORIALS_SHA=$tutorials_sha" >> "$GITHUB_ENV"
          echo "SOURCE_KBMONO_SHA=$kbmono_sha" >> "$GITHUB_ENV"

      - name: Build and test site
        run: npm test

      - name: Validate deploy configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Provision training request KV binding
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          NS_NAME="licheng-training"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"

          LIST_OUT=$(curl --silent -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100")
          LIST_CODE=$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100")
          if [ "$LIST_CODE" != "200" ]; then
            echo "::warning::KV namespace list returned HTTP $LIST_OUT $LIST_CODE. Grant the deploy token 'Workers KV Storage: Edit' permission to enable the training request center."
            exit 0
          fi

          NS_ID=$(printf '%s' "$LIST_OUT" | node --input-type=module -e "
              import fs from 'node:fs';
              const body = JSON.parse(fs.readFileSync(0, 'utf8'));
              const rows = Array.isArray(body.result) ? body.result : [];
              const hit = rows.find((row) => row.title === '$NS_NAME');
              process.stdout.write(hit ? hit.id : '');
            ")

          if [ -z "$NS_ID" ]; then
            echo "KV namespace $NS_NAME not found, creating..."
            CREATE_OUT=$(curl --silent -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "$API" --data "{\"title\":\"$NS_NAME\"}")
            NS_ID=$(printf '%s' "$CREATE_OUT" | node --input-type=module -e "
                import fs from 'node:fs';
                const body = JSON.parse(fs.readFileSync(0, 'utf8'));
                if (!body.success) { console.error(JSON.stringify(body.errors || body)); process.exit(1); }
                process.stdout.write(body.result ? body.result.id : '');
              " || true)
          fi

          if [ -z "$NS_ID" ]; then
            echo "::warning::Failed to resolve or create KV namespace. Grant 'Workers KV Storage: Edit' to the deploy token; the training center stays disabled until then."
            exit 0
          fi
          echo "KV namespace id: $NS_ID"

          HTTP_CODE=$(curl --silent --output /tmp/pages-project.json --write-out '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/licheng-ai-site" \
            --data "{\"deployment_configs\":{\"production\":{\"kv_namespaces\":{\"TRAINING_KV\":{\"namespace_id\":\"$NS_ID\"}}},\"preview\":{\"kv_namespaces\":{\"TRAINING_KV\":{\"namespace_id\":\"$NS_ID\"}}}}}")
          if [ "$HTTP_CODE" != "200" ]; then
            cat /tmp/pages-project.json >&2
            echo "::warning::Failed to bind KV to Pages project (HTTP $HTTP_CODE). Training center stays disabled; check token Pages permission."
            exit 0
          fi
          echo "TRAINING_KV binding is in place."

          echo "Cleaning up flagged submissions (removals list + test prefix)..."
          NS_ID="$NS_ID" CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" \
          REMOVALS_FILE="content/training-removals.txt" \
          node --input-type=module -e "
            import fs from 'node:fs'
            const base = 'https://api.cloudflare.com/client/v4/accounts/' + process.env.CLOUDFLARE_ACCOUNT_ID + '/storage/kv/namespaces/' + process.env.NS_ID
            const h = { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN }

            // 删除规则：[测试]前缀自动清理 + content/training-removals.txt 清单（整行精确匹配内容，或 id:编号）
            let removals = []
            try {
              removals = fs.readFileSync(process.env.REMOVALS_FILE, 'utf8')
                .split('\n').map((line) => line.trim())
                .filter((line) => line && !line.startsWith('#'))
            } catch { /* 清单文件不存在时仅按 [测试] 前缀清理 */ }
            const removalIds = new Set(removals.filter((r) => r.startsWith('id:')).map((r) => r.slice(3).trim()))
            const removalTexts = new Set(removals.filter((r) => !r.startsWith('id:')))

            const keysRes = await (await fetch(base + '/keys?limit=1000', { headers: h })).json()
            const names = (keysRes.result || []).map((k) => k.name).filter((n) => n.startsWith('req:'))
            let idx
            try { idx = JSON.parse(await (await fetch(base + '/values/idx', { headers: h })).text() || '[]') } catch { idx = [] }
            const removed = new Set()
            for (const name of names) {
              const raw = await (await fetch(base + '/values/' + name, { headers: h })).text()
              try {
                const row = JSON.parse(raw)
                const isFlagged = typeof row.c === 'string' && (
                  row.c.startsWith('[测试]') ||
                  removalTexts.has(row.c.trim().replace(/\s+/g, ' '))
                )
                if (isFlagged || removalIds.has(row.id)) removed.add(row.id)
              } catch { /* skip */ }
            }
            if (removed.size) {
              for (const id of removed) await fetch(base + '/values/req:' + id, { method: 'DELETE', headers: h })
              const kept = idx.filter((id) => !removed.has(id))
              await fetch(base + '/values/idx', { method: 'PUT', headers: h, body: JSON.stringify(kept) })
            }
            console.log('Removed ' + removed.size + ' submission(s) (flagged or listed in training-removals.txt).')
          "

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler pages deploy site/.vitepress/dist \
            --project-name=licheng-ai-site \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=false

      - name: Verify public site
        run: |
          for attempt in $(seq 1 12); do
            home=$(curl --fail --silent --show-error https://ai.licheng.uk/ || true)
            if printf '%s' "$home" | grep -q '李成律师法律AI工作站' \
              && curl --fail --silent --show-error https://ai.licheng.uk/latest/ >/dev/null \
              && curl --fail --silent --show-error https://ai.licheng.uk/sitemap.xml >/dev/null \
              && curl --fail --silent --show-error https://ai.licheng.uk/feed.xml >/dev/null \
              && curl --fail --silent --show-error https://ai.licheng.uk/tutorials/new-vps-opencode-web-ui-setup-ABL-20260709-V1 >/dev/null \
              && curl --fail --silent --show-error https://ai.licheng.uk/kb/ >/dev/null \
              && curl --fail --silent --show-error https://ai.licheng.uk/kb2025/ >/dev/null \
              && curl --fail --silent --show-error https://ai.licheng.uk/kb2024/ >/dev/null \
              && curl --fail --silent --show-error https://ai.licheng.uk/kb2023/ >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo 'Public site verification failed after deployment.' >&2
          exit 1

      - name: Retain only the three newest Pages deployments
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for round in $(seq 1 10); do
            npx wrangler pages deployment list --project-name=licheng-ai-site --json > deployments.json
            node --input-type=module -e "import fs from 'node:fs'; const rows=JSON.parse(fs.readFileSync('deployments.json','utf8')); for (const row of rows.slice(3)) console.log(row.Id ?? row.id)" > old-deployments.txt
            test -s old-deployments.txt || break
            while IFS= read -r deployment_id; do
              test -z "$deployment_id" || npx wrangler pages deployment delete "$deployment_id" --project-name=licheng-ai-site --force
            done < old-deployments.txt
          done
